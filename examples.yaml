# Example configurations for Movie Poster Card v2.0
# New Features: Auto-load posters from folder, Portrait/Landscape layouts, Fullscreen mode,
# Widget positioning & styling, Hide toolbar option

# ============================================
# BASIC CONFIGURATION (Auto-load from /media folder)
# ============================================
basic_media_folder:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /media/posters
  auto_load_folder: true
  poster_order: random

# ============================================
# BASIC CONFIGURATION (Manual list from /media)
# RECOMMENDED for /media folders
# ============================================
basic_media_manual:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  posters:
    - /media/posters/inception.jpg
    - /media/posters/interstellar.jpg
    - /media/posters/tenet.jpg
    - /media/posters/dunkirk.jpg
  poster_order: random

# ============================================
# BASIC CONFIGURATION (Auto-load from /local folder)
# ============================================
basic_local_folder:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /local/posters
  auto_load_folder: true
  poster_order: random

# ============================================
# BASIC CONFIGURATION (Manual poster list from /local)
# ============================================
basic_manual:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  posters:
    - /local/posters/inception.jpg
    - /local/posters/interstellar.jpg
    - /local/posters/tenet.jpg

# ============================================
# FULL FEATURED CONFIGURATION
# ============================================
full_featured:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /local/posters
  auto_load_folder: true
  poster_order: random
  slide_interval: 30
  transition_duration: 1000
  layout: landscape
  fullscreen: false
  hide_toolbar: false
  show_time: true
  show_weather: true
  weather_entity: weather.home
  show_now_playing_text: true
  title: "Movie Collection"
  poster_fit: cover
  widget_style: glass
  time_position: top-right
  weather_position: top-right

# ============================================
# WALL PANEL CONFIGURATION (Fullscreen)
# ============================================
wall_panel_fullscreen:
  type: custom:movie-poster-card
  media_player: media_player.wall_tablet
  poster_folder: /local/posters
  auto_load_folder: true
  poster_order: random
  slide_interval: 25
  layout: landscape
  fullscreen: true
  hide_toolbar: true
  show_time: true
  show_weather: true
  weather_entity: weather.home
  time_position: top-left
  weather_position: top-right
  widget_style: glass
  title: "Home Cinema"

# ============================================
# PORTRAIT TABLET CONFIGURATION
# ============================================
portrait_tablet:
  type: custom:movie-poster-card
  media_player: media_player.ipad
  poster_folder: /local/posters
  auto_load_folder: true
  poster_order: sequential
  layout: portrait
  show_time: true
  show_weather: true
  weather_entity: weather.home
  time_position: top-center
  weather_position: bottom-center
  widget_style: glass

# ============================================
# HOME THEATER (Minimal Interface)
# ============================================
home_theater_minimal:
  type: custom:movie-poster-card
  media_player: media_player.theater_apple_tv
  poster_folder: /local/posters/theater
  auto_load_folder: true
  poster_order: sequential
  slide_interval: 45
  transition_duration: 2000
  layout: landscape
  show_time: false
  show_weather: false
  show_now_playing_text: true
  title: "Home Theater"

# ============================================
# CUSTOM WIDGET STYLING (Bold & Colorful)
# ============================================
custom_styled_widgets:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /local/posters
  auto_load_folder: true
  show_time: true
  show_weather: true
  weather_entity: weather.home
  time_position: top-left
  weather_position: top-right
  time_style:
    font-size: 1.8rem
    font-weight: 700
    color: '#FFD700'
    background: 'rgba(0, 0, 0, 0.9)'
    border: 3px solid #FFD700
    border-radius: 30px
    padding: 1rem 2rem
  weather_style:
    font-size: 1.2rem
    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
    border: none
    border-radius: 25px
    padding: 0.8rem 1.5rem

# ============================================
# MINIMAL STYLE WIDGETS
# ============================================
minimal_widgets:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /local/posters
  auto_load_folder: true
  widget_style: minimal
  show_time: true
  time_position: bottom-right
  time_style:
    font-size: 1.2rem
    font-weight: 300
    text-shadow: '0 2px 8px rgba(0, 0, 0, 0.8)'

# ============================================
# SOLID WIDGET STYLE
# ============================================
solid_widgets:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_folder: /local/posters
  auto_load_folder: true
  widget_style: solid
  show_time: true
  show_weather: true
  weather_entity: weather.home

