  show_time: true
  time_position: top-left
  time_style:
    font-size: 1.5rem
    font-weight: 700
    color: '#FF6B6B'
    background: 'rgba(255, 255, 255, 0.9)'
    border-radius: 20px
    padding: 0.8rem 1.5rem
  title: "Kids Movies"

