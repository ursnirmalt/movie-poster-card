# Example configurations for Movie Poster Card

# ============================================
# BASIC CONFIGURATION
# ============================================
basic_example:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  posters:
    - /local/posters/inception.jpg
    - /local/posters/interstellar.jpg
    - /local/posters/tenet.jpg

# ============================================
# FULL FEATURED CONFIGURATION
# ============================================
full_featured:
  type: custom:movie-poster-card
  media_player: media_player.apple_tv
  poster_path: /local/posters
  posters:
    - /local/posters/action/mad_max_fury_road.jpg
    - /local/posters/action/john_wick.jpg
    - /local/posters/scifi/blade_runner_2049.jpg
    - /local/posters/scifi/arrival.jpg
    - /local/posters/scifi/interstellar.jpg
    - /local/posters/drama/1917.jpg
  slide_interval: 30
  show_time: true
  show_weather: true
  weather_entity: weather.home
  show_now_playing_text: true
  idle_timeout: 300
  transition_duration: 1000
  poster_fit: cover
  title: "Movie Collection"

